<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00d9ff">
<link rel="manifest" href="manifest.json">
<title>ARK Listable</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
  color: #e0e0e0;
  min-height: 100vh;
  padding: 10px;
  overflow-x: hidden;
}
.container { max-width: 600px; margin: 0 auto; padding-bottom: 80px; }
header {
  text-align: center;
  padding: 20px 0;
  background: rgba(0, 217, 255, 0.05);
  border-radius: 20px;
  margin-bottom: 20px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 217, 255, 0.1);
}
h1 {
  font-size: 2em;
  background: linear-gradient(135deg, #00d9ff, #ff6b9d, #c770f0);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 5px;
}
.tagline { font-size: 0.85em; color: #888; }
.energy-bar {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 15px 0;
  padding: 15px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 15px;
}
.energy-btn {
  padding: 8px 16px;
  border: 2px solid transparent;
  background: rgba(255, 255, 255, 0.05);
  color: #e0e0e0;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 0.9em;
}
.energy-btn.active { border-color: #00d9ff; background: rgba(0, 217, 255, 0.1); }
.energy-btn:hover { transform: scale(1.05); }
.add-section {
  background: rgba(255, 255, 255, 0.03);
  padding: 20px;
  border-radius: 15px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.input-group {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}
input[type="text"], textarea {
  flex: 1;
  padding: 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  color: #e0e0e0;
  font-size: 1em;
}
textarea { min-height: 60px; resize: vertical; }
button {
  padding: 12px 24px;
  background: linear-gradient(135deg, #00d9ff, #0099cc);
  border: none;
  border-radius: 10px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s;
  font-size: 1em;
}
button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 217, 255, 0.4); }
button:active { transform: translateY(0); }
.ai-suggest {
  background: linear-gradient(135deg, #c770f0, #8e44ad);
  margin-top: 10px;
  width: 100%;
}
.suggestion-box {
  margin-top: 10px;
  padding: 10px;
  background: rgba(199, 112, 240, 0.1);
  border-left: 3px solid #c770f0;
  border-radius: 8px;
  display: none;
  font-size: 0.9em;
}
.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  overflow-x: auto;
  padding-bottom: 5px;
}
.tab {
  padding: 10px 20px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  cursor: pointer;
  white-space: nowrap;
  border: 2px solid transparent;
  transition: all 0.3s;
}
.tab.active { border-color: #00d9ff; background: rgba(0, 217, 255, 0.1); }
.tasks { display: flex; flex-direction: column; gap: 10px; }
.task {
  background: rgba(255, 255, 255, 0.03);
  padding: 15px;
  border-radius: 12px;
  border-left: 4px solid #00d9ff;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.task::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, transparent, rgba(0, 217, 255, 0.05));
  opacity: 0;
  transition: opacity 0.3s;
}
.task:hover::before { opacity: 1; }
.task.completed { opacity: 0.6; }
.task.completed .task-title { text-decoration: line-through; }
.task.high { border-left-color: #ff6b9d; }
.task.medium { border-left-color: #ffaa00; }
.task.low { border-left-color: #00ff88; }
.checkbox {
  width: 24px;
  height: 24px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
}
.checkbox.checked {
  background: linear-gradient(135deg, #00d9ff, #0099cc);
  border-color: #00d9ff;
}
.checkbox.checked::after {
  content: '✓';
  color: white;
  font-weight: bold;
}
.task-content { flex: 1; }
.task-title { font-weight: 600; margin-bottom: 5px; }
.task-meta {
  font-size: 0.8em;
  color: #888;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.task-actions {
  display: flex;
  gap: 5px;
}
.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.05);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
  font-size: 1.1em;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.1); transform: scale(1.1); }
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 15px;
  margin-bottom: 20px;
}
.stat-card {
  background: rgba(255, 255, 255, 0.03);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.stat-value {
  font-size: 2em;
  font-weight: bold;
  background: linear-gradient(135deg, #00d9ff, #ff6b9d);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 0.85em; color: #888; margin-top: 5px; }
.focus-mode {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0f0f1e;
  z-index: 1000;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.focus-mode.active { display: flex; }
.focus-task {
  font-size: 1.5em;
  text-align: center;
  margin-bottom: 30px;
  max-width: 80%;
}
.timer {
  font-size: 4em;
  font-weight: bold;
  background: linear-gradient(135deg, #00d9ff, #ff6b9d);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 30px;
}
.priority-select {
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  color: #e0e0e0;
  font-size: 0.9em;
  margin-left: 10px;
}
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  padding: 10px;
  display: flex;
  justify-content: space-around;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
}
.nav-btn {
  padding: 10px 20px;
  background: transparent;
  border: none;
  color: #888;
  font-size: 0.9em;
  cursor: pointer;
  transition: all 0.3s;
}
.nav-btn.active { color: #00d9ff; }
@media (max-width: 600px) {
  h1 { font-size: 1.5em; }
  .timer { font-size: 3em; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🚀 ARK Listable</h1>
    <p class="tagline">Your Smart Productivity Companion</p>
  </header>

  <div class="energy-bar">
    <button class="energy-btn" data-energy="high">⚡ High Energy</button>
    <button class="energy-btn" data-energy="medium">🔋 Medium</button>
    <button class="energy-btn" data-energy="low">🌙 Low Energy</button>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-value" id="totalTasks">0</div>
      <div class="stat-label">Total Tasks</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="completedTasks">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="streak">0</div>
      <div class="stat-label">Day Streak</div>
    </div>
  </div>

  <div class="add-section">
    <div class="input-group">
      <input type="text" id="taskInput" placeholder="What needs to be done?">
      <select class="priority-select" id="prioritySelect">
        <option value="medium">Priority</option>
        <option value="high">🔴 High</option>
        <option value="medium" selected>🟡 Medium</option>
        <option value="low">🟢 Low</option>
      </select>
    </div>
    <textarea id="taskDetails" placeholder="Add details (optional)"></textarea>
    <button onclick="addTask()">+ Add Task</button>
    <button class="ai-suggest" onclick="aiSuggest()">✨ AI Suggest</button>
    <div class="suggestion-box" id="suggestionBox"></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-filter="all">All</div>
    <div class="tab" data-filter="active">Active</div>
    <div class="tab" data-filter="completed">Completed</div>
    <div class="tab" data-filter="high">High Priority</div>
  </div>

  <div class="tasks" id="tasksList"></div>
</div>

<div class="focus-mode" id="focusMode">
  <div class="focus-task" id="focusTask"></div>
  <div class="timer" id="timer">25:00</div>
  <button onclick="toggleTimer()">Start</button>
  <button onclick="exitFocus()" style="margin-top: 20px; background: rgba(255,255,255,0.1);">Exit Focus</button>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="showTasks()">📝 Tasks</button>
  <button class="nav-btn" onclick="startFocus()">🎯 Focus</button>
  <button class="nav-btn" onclick="showStats()">📊 Stats</button>
</div>

<script>
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}

let tasks = JSON.parse(localStorage.getItem('arkTasks')) || [];
let currentEnergy = localStorage.getItem('arkEnergy') || 'medium';
let streak = parseInt(localStorage.getItem('arkStreak')) || 0;
let currentFilter = 'all';
let timerInterval = null;
let timerSeconds = 25 * 60;

const suggestions = {
  high: ['Review and respond to emails', 'Brainstorm new ideas', 'Tackle complex problems', 'Important meetings'],
  medium: ['Write documentation', 'Code reviews', 'Plan tomorrow', 'Organize files'],
  low: ['Clean up workspace', 'Read articles', 'Update task lists', 'Light admin work']
};

// Energy selection
document.querySelectorAll('.energy-btn').forEach(btn => {
  if(btn.dataset.energy === currentEnergy) btn.classList.add('active');
  btn.onclick = () => {
    document.querySelectorAll('.energy-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentEnergy = btn.dataset.energy;
    localStorage.setItem('arkEnergy', currentEnergy);
  };
});

// Tab filtering
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    renderTasks();
  };
});

function addTask() {
  const input = document.getElementById('taskInput');
  const details = document.getElementById('taskDetails');
  const priority = document.getElementById('prioritySelect').value;
  if(!input.value.trim()) return;
  
  const task = {
    id: Date.now(),
    title: input.value,
    details: details.value,
    priority: priority,
    completed: false,
    createdAt: new Date().toISOString(),
    energy: currentEnergy
  };
  
  tasks.unshift(task);
  saveTasks();
  input.value = '';
  details.value = '';
  renderTasks();
  updateStats();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if(task) {
    task.completed = !task.completed;
    if(task.completed) {
      checkStreak();
    }
    saveTasks();
    renderTasks();
    updateStats();
  }
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  saveTasks();
  renderTasks();
  updateStats();
}

function renderTasks() {
  let filtered = tasks;
  if(currentFilter === 'active') filtered = tasks.filter(t => !t.completed);
  if(currentFilter === 'completed') filtered = tasks.filter(t => t.completed);
  if(currentFilter === 'high') filtered = tasks.filter(t => t.priority === 'high');
  
  const html = filtered.map(task => `
    <div class="task ${task.completed ? 'completed' : ''} ${task.priority}">
      <div class="checkbox ${task.completed ? 'checked' : ''}" onclick="toggleTask(${task.id})"></div>
      <div class="task-content">
        <div class="task-title">${task.title}</div>
        ${task.details ? `<div class="task-meta">${task.details}</div>` : ''}
        <div class="task-meta">
          <span>${task.priority === 'high' ? '🔴' : task.priority === 'low' ? '🟢' : '🟡'} ${task.priority}</span>
          <span>${task.energy === 'high' ? '⚡' : task.energy === 'low' ? '🌙' : '🔋'} ${task.energy}</span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-btn" onclick="deleteTask(${task.id})">🗑️</button>
      </div>
    </div>
  `).join('');
  
  document.getElementById('tasksList').innerHTML = html || '<p style="text-align:center;color:#888;">No tasks yet</p>';
}

function updateStats() {
  document.getElementById('totalTasks').textContent = tasks.length;
  document.getElementById('completedTasks').textContent = tasks.filter(t => t.completed).length;
  document.getElementById('streak').textContent = streak;
}

function checkStreak() {
  const lastCompleted = localStorage.getItem('arkLastCompleted');
  const today = new Date().toDateString();
  if(lastCompleted !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    if(lastCompleted === yesterday) {
      streak++;
    } else {
      streak = 1;
    }
    localStorage.setItem('arkStreak', streak);
    localStorage.setItem('arkLastCompleted', today);
  }
}

function aiSuggest() {
  const box = document.getElementById('suggestionBox');
  const suggestions_list = suggestions[currentEnergy];
  const random = suggestions_list[Math.floor(Math.random() * suggestions_list.length)];
  box.textContent = `💡 Based on your ${currentEnergy} energy: ${random}`;
  box.style.display = 'block';
  setTimeout(() => box.style.display = 'none', 5000);
}

function startFocus() {
  const activeTasks = tasks.filter(t => !t.completed);
  if(activeTasks.length === 0) {
    alert('No active tasks to focus on!');
    return;
  }
  const task = activeTasks[0];
  document.getElementById('focusTask').textContent = task.title;
  document.getElementById('focusMode').classList.add('active');
}

function exitFocus() {
  document.getElementById('focusMode').classList.remove('active');
  if(timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  timerSeconds = 25 * 60;
  document.getElementById('timer').textContent = '25:00';
}

function toggleTimer() {
  if(timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
    event.target.textContent = 'Start';
  } else {
    event.target.textContent = 'Pause';
    timerInterval = setInterval(() => {
      timerSeconds--;
      const mins = Math.floor(timerSeconds / 60);
      const secs = timerSeconds % 60;
      document.getElementById('timer').textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
      if(timerSeconds <= 0) {
        clearInterval(timerInterval);
        alert('Focus session complete! 🎉');
        exitFocus();
      }
    }, 1000);
  }
}

function showTasks() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
}

function showStats() {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  alert(`Stats:\n\nTotal: ${tasks.length}\nCompleted: ${tasks.filter(t=>t.completed).length}\nStreak: ${streak} days\n\nKeep going! 🚀`);
}

function saveTasks() {
  localStorage.setItem('arkTasks', JSON.stringify(tasks));
}

renderTasks();
updateStats();
</script>
</body>
</html>
